# Test Configuration - In-Memory Isolated Database
spring.application.name=social-media-backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=9a618cf3ab0a350eb4f51f1087dbb3ff8834d0be9e80488ce155fa8b4a2d0eee
app.jwt.expiration-ms=604800000

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./target/test-uploads

# Short-Video Upload & Concurrency Settings
app.video.max-duration-seconds=20.0
app.video.max-file-size-mb=50
app.video.allowed-mime-types=video/mp4,video/webm
app.video.upload-dir=./target/test-uploads/videos
app.video.async.core-pool-size=4
app.video.async.max-pool-size=16
app.video.async.queue-capacity=200
