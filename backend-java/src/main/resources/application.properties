# Server Configuration
server.port=8080
spring.application.name=social-media-backend
spring.main.allow-circular-references=true

# Database Configuration (H2 File / Memory mode for zero-config out-of-the-box execution + MySQL profile capability)
spring.datasource.url=jdbc:h2:file:./database/social_media_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=9a618cf3ab0a350eb4f51f1087dbb3ff8834d0be9e80488ce155fa8b4a2d0eee
app.jwt.expiration-ms=604800000

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./uploads

# Short-Video Upload & High-Concurrency System Settings
app.video.max-duration-seconds=20.0
app.video.max-file-size-mb=50
app.video.allowed-mime-types=video/mp4,video/webm
app.video.upload-dir=./uploads/videos
app.video.async.core-pool-size=4
app.video.async.max-pool-size=16
app.video.async.queue-capacity=200

# Reel & Audio System Settings
reel.max-duration-seconds=20.0
reel.max-file-size=52428800
reel.upload-dir=./uploads/reels
reel.ffmpeg.enabled=true
reel.ffmpeg.path=ffmpeg

# Playlist System Settings
playlist.max-videos=100

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

